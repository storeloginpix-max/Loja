<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - X SOLO 1 V 47</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: #e3e6e8;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 24px;
            background: linear-gradient(145deg, #141414, #0f0f0f);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FFD814, transparent);
        }
        .header h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .header h1 span { color: #FFD814; }
        .header p { color: #888; font-size: 0.95rem; }

        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 150px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-family: 'Russo One', sans-serif;
            font-size: 1.8rem;
            color: #FFD814;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: #FFD814;
            color: #000;
        }
        .btn-primary:hover { background: #F7CA00; transform: translateY(-2px); }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary {
            background: #141414;
            color: #ccc;
            border: 1px solid #2a2a2a;
        }
        .btn-secondary:hover { border-color: #FFD814; color: #FFD814; }

        .players-table {
            width: 100%;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-header {
            display: grid;
            grid-template-columns: 60px 1fr 120px 100px 100px 140px 100px;
            padding: 14px 16px;
            background: rgba(255, 216, 20, 0.05);
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.8rem;
            font-weight: 700;
            color: #FFD814;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-row {
            display: grid;
            grid-template-columns: 60px 1fr 120px 100px 100px 140px 100px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .table-row:hover { background: rgba(255, 255, 255, 0.02); }
        .table-row:last-child { border-bottom: none; }
        .table-cell {
            color: #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .table-cell.vaga {
            font-family: 'Russo One', sans-serif;
            color: #FFD814;
            text-align: center;
        }
        .table-cell.id-pagamento {
            font-size: 0.75rem;
            color: #888;
        }
        .table-actions {
            display: flex;
            gap: 6px;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn-icon.edit {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }
        .btn-icon.edit:hover { background: rgba(59, 130, 246, 0.3); }
        .btn-icon.delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .btn-icon.delete:hover { background: rgba(239, 68, 68, 0.3); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }
        .loading-state i {
            animation: spin 1s linear infinite;
            font-size: 2rem;
            color: #FFD814;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            font-family: 'Russo One', sans-serif;
            font-size: 1.3rem;
            color: #FFD814;
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus { outline: none; border-color: #FFD814; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions .btn { flex: 1; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 2000;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: #10b981;
            color: #fff;
        }
        .toast.error {
            background: #ef4444;
            color: #fff;
        }

        @media (max-width: 768px) {
            .table-header { display: none; }
            .table-row {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 16px;
            }
            .table-cell { font-size: 0.85rem; }
            .table-cell::before {
                content: attr(data-label);
                display: block;
                font-size: 0.7rem;
                color: #666;
                text-transform: uppercase;
                margin-bottom: 2px;
            }
            .table-actions { justify-content: flex-end; margin-top: 8px; }
            .stats-bar { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>PAINEL <span>ADMIN</span></h1>
            <p>Gerenciamento de Jogadores Inscritos</p>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Inscritos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statVagas">48</div>
                <div class="stat-label">Vagas Disponíveis</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statPercent">0%</div>
                <div class="stat-label">Preenchido</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="carregarJogadores()">
                <i class="ph ph-arrows-clockwise"></i> Atualizar Lista
            </button>
            <button class="btn btn-danger" onclick="confirmarLimparTudo()">
                <i class="ph ph-trash"></i> Apagar Todos
            </button>
            <a href="index.html" class="btn btn-secondary">
                <i class="ph ph-arrow-left"></i> Voltar ao Site
            </a>
        </div>

        <div class="players-table" id="playersTable">
            <div class="loading-state" id="loadingState">
                <i class="ph ph-spinner"></i>
                <p style="color: #888; margin-top: 12px;">Carregando jogadores...</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Editar Jogador</div>
                <button class="modal-close" onclick="fecharModal()">&times;</button>
            </div>
            <form id="editForm" onsubmit="salvarEdicao(event)">
                <input type="hidden" id="editIdPagamento">
                <div class="form-group">
                    <label>Sala / Vaga</label>
                    <input type="text" id="editSala" required>
                </div>
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="editNome" required>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="editTelefone" required>
                </div>
                <div class="form-group">
                    <label>ID Free Fire</label>
                    <input type="text" id="editIdFF" required>
                </div>
                <div class="form-group">
                    <label>Nome no Jogo</label>
                    <input type="text" id="editNomeJogo" required>
                </div>
                <div class="form-group">
                    <label>Chave PIX</label>
                    <input type="text" id="editPix" required>
                </div>
                <div class="form-group">
                    <label>ID Pagamento (TXID)</label>
                    <input type="text" id="editTxid" readonly style="opacity: 0.6; cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="editCpf" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="ph ph-floppy-disk"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxMcASfDg41MrWWjLaWE7Ojsz_3trO_1vfEOWTw1YEMEnWJXuN5Rj6XRJoduitPqaMukQ/exec';
        const MAX_VAGAS = 48;
        let jogadores = [];

        function mostrarToast(mensagem, tipo = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.className = `toast ${tipo} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function carregarJogadores() {
            const table = document.getElementById('playersTable');
            table.innerHTML = `
                <div class="loading-state">
                    <i class="ph ph-spinner"></i>
                    <p style="color: #888; margin-top: 12px;">Carregando jogadores...</p>
                </div>
            `;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'read' })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    jogadores = result.data || [];
                    atualizarEstatisticas();
                    renderizarTabela();
                } else {
                    throw new Error(result.message || 'Erro ao carregar dados');
                }
            } catch (error) {
                table.innerHTML = `
                    <div class="empty-state">
                        <i class="ph ph-warning-circle"></i>
                        <p>Erro ao carregar: ${error.message}</p>
                    </div>
                `;
                mostrarToast('Erro ao carregar jogadores', 'error');
            }
        }

        function atualizarEstatisticas() {
            const total = jogadores.length;
            const vagas = Math.max(0, MAX_VAGAS - total);
            const percent = Math.round((total / MAX_VAGAS) * 100);

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statVagas').textContent = vagas;
            document.getElementById('statPercent').textContent = percent + '%';
        }

        function renderizarTabela() {
            const table = document.getElementById('playersTable');

            if (jogadores.length === 0) {
                table.innerHTML = `
                    <div class="empty-state">
                        <i class="ph ph-users"></i>
                        <p>Nenhum jogador inscrito ainda</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-header">
                    <div>Vaga</div>
                    <div>Nome</div>
                    <div>Telefone</div>
                    <div>ID FF</div>
                    <div>PIX</div>
                    <div>ID Pagamento</div>
                    <div>Ações</div>
                </div>
            `;

            jogadores.forEach((jogador, index) => {
                html += `
                    <div class="table-row">
                        <div class="table-cell vaga" data-label="Vaga">${jogador.sala || '-'}</div>
                        <div class="table-cell" data-label="Nome">${jogador.Nome || '-'}</div>
                        <div class="table-cell" data-label="Telefone">${jogador.Telefone || '-'}</div>
                        <div class="table-cell" data-label="ID FF">${jogador.ID || '-'}</div>
                        <div class="table-cell" data-label="PIX">${jogador.pix || '-'}</div>
                        <div class="table-cell id-pagamento" data-label="ID Pagamento">${jogador['id pagamento'] || '-'}</div>
                        <div class="table-actions">
                            <button class="btn-icon edit" onclick="abrirEdicao(${index})" title="Editar">
                                <i class="ph ph-pencil-simple"></i>
                            </button>
                            <button class="btn-icon delete" onclick="confirmarApagar(${index})" title="Apagar">
                                <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            table.innerHTML = html;
        }

        function abrirEdicao(index) {
            const jogador = jogadores[index];
            document.getElementById('editIdPagamento').value = jogador['id pagamento'];
            document.getElementById('editSala').value = jogador.sala || '';
            document.getElementById('editNome').value = jogador.Nome || '';
            document.getElementById('editTelefone').value = jogador.Telefone || '';
            document.getElementById('editIdFF').value = jogador.ID || '';
            document.getElementById('editNomeJogo').value = jogador['nome no jogo'] || '';
            document.getElementById('editPix').value = jogador.pix || '';
            document.getElementById('editTxid').value = jogador['id pagamento'] || '';
            document.getElementById('editCpf').value = jogador.cpf || '';
            document.getElementById('editModal').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function salvarEdicao(event) {
            event.preventDefault();

            const idPagamento = document.getElementById('editIdPagamento').value;

            const payload = {
                action: 'update',
                'id pagamento': idPagamento,
                'sala': document.getElementById('editSala').value,
                'Nome': document.getElementById('editNome').value,
                'Telefone': document.getElementById('editTelefone').value,
                'ID': document.getElementById('editIdFF').value,
                'nome no jogo': document.getElementById('editNomeJogo').value,
                'pix': document.getElementById('editPix').value,
                'cpf': document.getElementById('editCpf').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    mostrarToast('Jogador atualizado com sucesso!');
                    fecharModal();
                    carregarJogadores();
                } else {
                    throw new Error(result.message || 'Erro ao salvar');
                }
            } catch (error) {
                mostrarToast('Erro: ' + error.message, 'error');
            }
        }

        function confirmarApagar(index) {
            const jogador = jogadores[index];
            const nome = jogador.Nome || 'Jogador';
            const vaga = jogador.sala || '?';

            if (confirm(`Apagar ${nome} da vaga ${vaga}?\n\nEsta ação não pode ser desfeita.`)) {
                apagarJogador(index);
            }
        }

        async function apagarJogador(index) {
            const jogador = jogadores[index];
            const idPagamento = jogador['id pagamento'];

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'delete',
                        'id pagamento': idPagamento
                    })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    mostrarToast('Jogador apagado com sucesso!');
                    carregarJogadores();
                } else {
                    throw new Error(result.message || 'Erro ao apagar');
                }
            } catch (error) {
                mostrarToast('Erro: ' + error.message, 'error');
            }
        }

        function confirmarLimparTudo() {
            if (jogadores.length === 0) {
                mostrarToast('Não há jogadores para apagar', 'error');
                return;
            }

            if (confirm(`⚠️ ATENÇÃO!\n\nVocê está prestes a APAGAR TODOS os ${jogadores.length} jogadores.\n\nEsta ação NÃO pode ser desfeita.\n\nDeseja continuar?`)) {
                if (confirm('ÚLTIMA CHANCE!\n\nTem CERTEZA ABSOLUTA que quer apagar todos?\n\nToque OK para confirmar.')) {
                    limparTudo();
                }
            }
        }

        async function limparTudo() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'clearAll' })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    mostrarToast('Todos os jogadores foram apagados!');
                    carregarJogadores();
                } else {
                    throw new Error(result.message || 'Erro ao limpar');
                }
            } catch (error) {
                mostrarToast('Erro: ' + error.message, 'error');
            }
        }

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });

        window.addEventListener('DOMContentLoaded', () => {
            carregarJogadores();
        });
    </script>
</body>
</html>
