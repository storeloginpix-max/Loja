<style>
  :root {
    --bg-primary: #050505;
    --bg-card: #0c0c0c;
    --bg-button: #111111;
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(255, 255, 255, 0.12);
    --text-primary: #ffffff;
    --text-secondary: #888888;
    --text-muted: #555555;
    
    --wa-color: #25D366;
    --ig-color: #E1306C;
    --tt-color: #00f2ea;
    --tt-color-2: #ff0050;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 20px;
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(37, 211, 102, 0.03) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(225, 48, 108, 0.03) 0%, transparent 40%);
    color: var(--text-primary);
  }

  .container {
    width: 100%;
    max-width: 460px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 
      0 24px 80px rgba(0, 0, 0, 0.8),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  }

  .header {
    text-align: center;
    padding-bottom: 28px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .category-label {
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .brand {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .brand .highlight {
    background: linear-gradient(135deg, #fff 0%, #aaa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand .sub {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 4px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .section {
    margin-bottom: 28px;
  }

  .section:last-of-type {
    margin-bottom: 0;
  }

  .section-title {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .contact-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 18px 20px;
    background: var(--bg-button);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    text-decoration: none;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .contact-btn:last-child {
    margin-bottom: 0;
  }

  .contact-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
    transition: left 0.6s ease;
  }

  .contact-btn:hover::after {
    left: 100%;
  }

  .contact-btn:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
  }

  /* Brand Specific Hover Effects */
  .contact-btn.whatsapp:hover {
    border-color: rgba(37, 211, 102, 0.3);
    box-shadow: 0 12px 32px rgba(37, 211, 102, 0.08);
  }

  .contact-btn.group:hover {
    border-color: rgba(37, 211, 102, 0.3);
    box-shadow: 0 12px 32px rgba(37, 211, 102, 0.08);
  }

  .contact-btn.instagram:hover {
    border-color: rgba(225, 48, 108, 0.3);
    box-shadow: 0 12px 32px rgba(225, 48, 108, 0.08);
  }

  .contact-btn.tiktok:hover {
    border-color: rgba(0, 242, 234, 0.3);
    box-shadow: 0 12px 32px rgba(0, 242, 234, 0.06), 0 12px 32px rgba(255, 0, 80, 0.04);
  }

  .icon-wrapper {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.04);
    transition: all 0.3s ease;
  }

  .whatsapp:hover .icon-wrapper { background: rgba(37, 211, 102, 0.1); border-color: rgba(37, 211, 102, 0.2); }
  .group:hover .icon-wrapper { background: rgba(37, 211, 102, 0.1); border-color: rgba(37, 211, 102, 0.2); }
  .instagram:hover .icon-wrapper { background: rgba(225, 48, 108, 0.1); border-color: rgba(225, 48, 108, 0.2); }
  .tiktok:hover .icon-wrapper { background: rgba(0, 242, 234, 0.08); border-color: rgba(0, 242, 234, 0.2); }

  .icon-wrapper svg {
    width: 24px;
    height: 24px;
    transition: transform 0.3s ease;
  }

  .contact-btn:hover .icon-wrapper svg {
    transform: scale(1.1);
  }

  .contact-info {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .contact-label {
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: -0.2px;
  }

  .contact-sub {
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    color: var(--text-muted);
    font-size: 20px;
    font-weight: 300;
    transition: all 0.3s ease;
    margin-left: auto;
  }

  .contact-btn:hover .arrow {
    transform: translateX(4px);
    color: var(--text-secondary);
  }

  .footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--border-subtle);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .container {
      padding: 28px 20px;
      border-radius: 16px;
    }
    .brand {
      font-size: 22px;
    }
  }
</style>

<script>
    // Remove/esconde o iframe do Netlify
    (function hideNetlifyBadge() {
        function removeBadge() {
            // Tenta esconder pelo ID
            var iframe = document.getElementById('nl-badge-frame');
            if (iframe) {
                iframe.style.display = 'none';
                iframe.style.visibility = 'hidden';
                iframe.style.opacity = '0';
                iframe.remove(); // Remove completamente do DOM
            }
            
            // Tenta esconder por seletor CSS genérico
            var badges = document.querySelectorAll('iframe[title*="Netlify"], iframe[srcdoc*="Netlify"]');
            badges.forEach(function(badge) {
                badge.style.display = 'none';
                badge.remove();
            });
        }

        // Executa imediatamente
        removeBadge();

        // Executa após DOM carregado
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', removeBadge);
        }

        // Executa após página carregar completamente
        window.addEventListener('load', function() {
            setTimeout(removeBadge, 100);
            setTimeout(removeBadge, 500);
            setTimeout(removeBadge, 1500);
        });

        // Usa MutationObserver para detectar quando o iframe for injetado
        if (window.MutationObserver) {
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.tagName === 'IFRAME' && 
                            (node.id === 'nl-badge-frame' || 
                             node.title.indexOf('Netlify') !== -1)) {
                            node.style.display = 'none';
                            setTimeout(function() { node.remove(); }, 10);
                        }
                    });
                });
            });

            observer.observe(document.body || document.documentElement, {
                childList: true,
                subtree: true
            });
        }
    })();
</script>
