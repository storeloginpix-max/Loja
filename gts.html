<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Inscrição - X SOLO 1 V 47</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e3e6e8;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .loading-circle {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 216, 20, 0.1);
            border-top: 4px solid #FFD814;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #FFD814;
            margin-bottom: 12px;
        }

        .loading-subtext {
            font-size: 0.9rem;
            color: #999;
            margin-bottom: 20px;
        }

        .status-message {
            background: rgba(255, 216, 20, 0.1);
            border: 1px solid rgba(255, 216, 20, 0.3);
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ccc;
            display: none;
            line-height: 1.5;
            white-space: pre-line; /* Permite quebra de linha na mensagem */
        }

        .status-message.error {
            background: rgba(204, 12, 57, 0.1);
            border-color: rgba(204, 12, 57, 0.3);
            color: #ff6b6b;
        }

        .status-message.success {
            background: rgba(6, 125, 98, 0.1);
            border-color: rgba(6, 125, 98, 0.3);
            color: #067d62;
        }

        .btn-action {
            background: #FFD814;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            width: 100%;
            font-size: 1rem;
            text-decoration: none;
        }

        .btn-action:hover { background: #F7CA00; }
        .btn-action.danger { background: #cc0c39; color: #fff; }

        .security-notice {
            margin-top: 40px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.8rem;
            color: #666;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* MENSAGEM FLUTUANTE DE FRAUDE */
        .fraud-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #cc0c39;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(204, 12, 57, 0.5);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fraud-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .loading-text { font-size: 1rem; }
            .loading-subtext { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Toast de Fraude -->
    <div id="fraudToast" class="fraud-toast">
        ⚠️ Fraude detectada. Redirecionando...
    </div>

    <div class="container">
        <div class="loading-circle" id="loadingCircle"></div>
        <div class="loading-text" id="loadingText">⚠️ NÃO SAIA DESSA TELA</div>
        <div class="loading-subtext" id="loadingSubtext">Verificando seus dados e processando inscrição...</div>
        
        <div id="statusMessage" class="status-message"></div>
        <button id="btnAction" class="btn-action">Ação</button>

        <div class="security-notice">
            🔒 Conexão segura • Dados criptografados • Processamento automático
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES
        const SHEET_ID = '1n0pEm4fhV-MxilAiGM9ec4FQ_noPoZevNjziha56IVA';
        const SHEETMONKEY_URL = 'https://api.sheetmonkey.io/form/kgNwCg4kgTtyH9poCzcuvD';
        const PIX_WORKER_URL = 'https://pix1.store-login-pix.workers.dev';
        const MAX_VAGAS = 48;
        
        let validatedData = null;

        function generateHash(data) {
            const str = JSON.stringify(data);
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(16);
        }

        function getValidatedParams() {
            const params = new URLSearchParams(window.location.search);
            const data = {
                txid: params.get('txid'),
                vaga: params.get('vaga'),
                valor: params.get('valor'),
                data: params.get('data'),
                idFF: params.get('idFF'),
                nomeJogador: params.get('nomeJogador'),
                whatsapp: params.get('whatsapp'),
                chavePix: params.get('chavePix'),
                nomeCompleto: params.get('nomeCompleto'),
                cpf: params.get('cpf')
            };

            const requiredFields = ['txid', 'vaga', 'valor', 'idFF', 'nomeJogador', 'whatsapp', 'chavePix', 'nomeCompleto', 'cpf'];
            for (let field of requiredFields) {
                if (!data[field] || data[field].trim() === '') {
                    throw new Error(`Parâmetro inválido ou ausente: ${field}`);
                }
            }

            if (!/^\d{8,12}$/.test(data.idFF)) throw new Error('ID do Free Fire inválido');
            if (!/^\d{10,11}$/.test(data.whatsapp)) throw new Error('WhatsApp inválido');
            if (!/^\d{11}$/.test(data.cpf)) throw new Error('CPF inválido');
            if (!/^\d{1,2}$/.test(data.vaga)) throw new Error('Número da vaga inválido');

            data.nomeCompleto = data.nomeCompleto.trim().substring(0, 100);
            data.nomeJogador = decodeURIComponent(data.nomeJogador).trim().substring(0, 50);
            data.chavePix = data.chavePix.trim().substring(0, 100);

            return data;
        }

        async function checkDuplicateTxid(txid) {
            try {
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
                const response = await fetch(csvUrl, { method: 'GET', cache: 'no-cache' });
                if (!response.ok) return false;

                const text = await response.text();
                if (text.trim().startsWith('<')) return false;

                const linhas = text.split('\n');
                for (let i = 1; i < linhas.length; i++) {
                    const colunas = linhas[i].split(',');
                    if (colunas[6] && colunas[6].trim() === txid) return true;
                }
                return false;
            } catch (error) {
                return false;
            }
        }

        async function checkVagaAvailability(vagaNumero) {
            try {
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
                const response = await fetch(csvUrl, { method: 'GET', cache: 'no-cache' });
                if (!response.ok) return { available: true, count: 0 };

                const text = await response.text();
                if (text.trim().startsWith('<')) return { available: true, count: 0 };

                const linhas = text.split('\n').filter(l => l.trim() !== '');
                const count = Math.max(0, linhas.length - 1);

                if (count >= MAX_VAGAS) return { available: false, count: count };

                for (let i = 1; i < linhas.length; i++) {
                    const colunas = linhas[i].split(',');
                    if (colunas[0] && colunas[0].trim() === vagaNumero) {
                        return { available: false, count: count, occupied: true };
                    }
                }
                return { available: true, count: count };
            } catch (error) {
                return { available: true, count: 0 };
            }
        }

        async function verifyPayment(txid) {
            try {
                const response = await fetch(PIX_WORKER_URL + '/verificar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transactionId: txid })
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    throw new Error("O servidor de pagamento está instável no momento.");
                }

                if (data.erro) throw new Error("Erro no servidor: " + data.erro);

                const status = data.status ? String(data.status).toUpperCase() : '';
                return status === 'COMPLETO' || status === 'PAID' || status === 'APROVADO' || status === 'APPROVED' || status === 'SUCCESS' || status === 'COMPLETED';
                
            } catch (error) {
                console.error('Erro ao verificar pagamento:', error);
                throw error;
            }
        }

        async function saveToSheet(data) {
            try {
                const payload = {
                    'sala': data.vaga,
                    'Nome': data.nomeCompleto,
                    'Telefone': data.whatsapp,
                    'ID': data.idFF,
                    'nome no jogo': data.nomeJogador,
                    'pix': data.chavePix,
                    'id pagamento': data.txid,
                    'cpf': data.cpf
                };

                const response = await fetch(SHEETMONKEY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const text = await response.text();
                
                if (response.ok) {
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        // Dispara erro específico que sabemos que é sucesso
                        throw new Error('SALVO_COM_SUCESSO_MAS_RETORNOU_HTML');
                    }
                } else {
                    throw new Error('Erro ao salvar no banco de dados: ' + text.substring(0, 100));
                }
            } catch (error) {
                if (error.message === 'SALVO_COM_SUCESSO_MAS_RETORNOU_HTML') throw error;
                throw error;
            }
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            statusEl.style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingCircle').style.display = 'none';
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('loadingSubtext').style.display = 'none';
        }

        function setActionButton(text, targetUrl, isDanger = false) {
            const btn = document.getElementById('btnAction');
            btn.textContent = text;
            btn.className = 'btn-action' + (isDanger ? ' danger' : '');
            btn.onclick = function() { window.location.href = targetUrl; };
            btn.style.display = 'block';
        }

        function showFraudToastAndRedirect() {
            const toast = document.getElementById('fraudToast');
            toast.classList.add('show');
            hideLoading();
            document.getElementById('statusMessage').style.display = 'none';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2500);
        }

        async function processInscription() {
            let currentData = null;
            try {
                showStatus('Validando dados da inscrição...');
                const data = getValidatedParams();
                currentData = data;
                
                showStatus('Verificando integridade dos dados...');
                const isDuplicate = await checkDuplicateTxid(data.txid);
                if (isDuplicate) {
                    throw new Error('Esta inscrição já foi processada. ID de pagamento duplicado detectado.');
                }

                showStatus('Verificando disponibilidade da vaga...');
                const availability = await checkVagaAvailability(data.vaga);
                
                if (!availability.available) {
                    if (availability.occupied) {
                        throw new Error(`A vaga ${data.vaga} não está mais disponível.`);
                    } else {
                        throw new Error('Todas as 48 vagas já foram preenchidas.');
                    }
                }

                showStatus('Confirmando pagamento PIX...');
                const paymentConfirmed = await verifyPayment(data.txid);
                if (!paymentConfirmed) {
                    throw new Error('Pagamento ainda não foi confirmado. Aguarde alguns minutos e recarregue a página.');
                }

                showStatus('Salvando inscrição no banco de dados...');
                await saveToSheet(data);

                validatedData = { ...data, timestamp: Date.now(), hash: generateHash(data) };
                sessionStorage.setItem('validatedInscription', JSON.stringify(validatedData));

                showStatus('✅ Inscrição confirmada com sucesso! Redirecionando...', 'success');
                setTimeout(() => {
                    const params = new URLSearchParams({ txid: data.txid, vaga: data.vaga });
                    window.location.href = 'awb.html?' + params.toString();
                }, 1500);

            } catch (error) {
                console.error('Erro no processamento:', error);
                
                // 1. SUCESSO DISFARÇADO (SheetMonkey retornou HTML mas salvou)
                if (error.message === 'SALVO_COM_SUCESSO_MAS_RETORNOU_HTML' || error.message.includes('Unexpected token')) {
                    showStatus('✅ Inscrição processada com sucesso! Redirecionando...', 'success');
                    setTimeout(() => {
                        const params = new URLSearchParams({ txid: currentData.txid, vaga: currentData.vaga });
                        window.location.href = 'awb.html?' + params.toString();
                    }, 1500);
                    return;
                }

                // 2. FRAUDE / ERRO MISTICPAY
                if (error.message.includes('Erro MisticPay') || error.message.toLowerCase().includes('fraude')) {
                    showFraudToastAndRedirect();
                    return;
                }

                // 3. VAGA INDISPONÍVEL (MAS JÁ PAGOU) -> BOTÃO DE SUPORTE
                if (error.message.includes('não está mais disponível') || error.message.includes('48 vagas já foram preenchidas')) {
                    hideLoading();
                    showStatus(
                        `⚠️ ${error.message}\n\nComo seu pagamento já foi confirmado, por favor, entre em contato com nosso suporte para regularizar sua situação imediatamente.`, 
                        'error'
                    );
                    setActionButton('Entrar em Contato com o Suporte', 'contato.html');
                    return;
                }

                // 4. OUTROS ERROS GENÉRICOS
                hideLoading();
                showStatus('❌ ' + error.message, 'error');
                setActionButton('Voltar ao Início', 'index.html', true);
            }
        }

        function checkAlreadyProcessed() {
            const params = new URLSearchParams(window.location.search);
            const txid = params.get('txid');
            const processed = sessionStorage.getItem('processedTxids');
            const processedList = processed ? JSON.parse(processed) : [];

            if (processedList.includes(txid)) {
                showStatus('Esta inscrição já foi processada. Redirecionando...', 'success');
                setTimeout(() => {
                    const vaga = params.get('vaga');
                    window.location.href = 'awb.html?txid=' + txid + '&vaga=' + vaga;
                }, 1500);
                return true;
            }

            processedList.push(txid);
            sessionStorage.setItem('processedTxids', JSON.stringify(processedList));
            return false;
        }

        history.pushState(null, null, location.href);
        window.onpopstate = function() { history.go(1); };

        let isLoading = true;
        window.onbeforeunload = function() {
            if (isLoading) return "Não saia da tela enquanto processamos sua inscrição!";
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (!checkAlreadyProcessed()) processInscription();
            }, 1000);
        });

        window.addEventListener('beforeunload', () => {
            isLoading = false;
            window.onbeforeunload = null;
        });
    </script>
</body>
</html>

<script>
    // Remove/esconde o iframe do Netlify
    (function hideNetlifyBadge() {
        function removeBadge() {
            // Tenta esconder pelo ID
            var iframe = document.getElementById('nl-badge-frame');
            if (iframe) {
                iframe.style.display = 'none';
                iframe.style.visibility = 'hidden';
                iframe.style.opacity = '0';
                iframe.remove(); // Remove completamente do DOM
            }
            
            // Tenta esconder por seletor CSS genérico
            var badges = document.querySelectorAll('iframe[title*="Netlify"], iframe[srcdoc*="Netlify"]');
            badges.forEach(function(badge) {
                badge.style.display = 'none';
                badge.remove();
            });
        }

        // Executa imediatamente
        removeBadge();

        // Executa após DOM carregado
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', removeBadge);
        }

        // Executa após página carregar completamente
        window.addEventListener('load', function() {
            setTimeout(removeBadge, 100);
            setTimeout(removeBadge, 500);
            setTimeout(removeBadge, 1500);
        });

        // Usa MutationObserver para detectar quando o iframe for injetado
        if (window.MutationObserver) {
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.tagName === 'IFRAME' && 
                            (node.id === 'nl-badge-frame' || 
                             node.title.indexOf('Netlify') !== -1)) {
                            node.style.display = 'none';
                            setTimeout(function() { node.remove(); }, 10);
                        }
                    });
                });
            });

            observer.observe(document.body || document.documentElement, {
                childList: true,
                subtree: true
            });
        }
    })();
</script>
