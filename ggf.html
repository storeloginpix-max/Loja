    <script>
        // ✅ NOVA URL DA API (VERSÃO 2 - PÚBLICA)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-TFTchINF5Gl3rR2NA3m9J4Q3enh2mZMVCYUXAHXz-gz0i_5zbIpq8eAQANvT7hEi/exec";
        const PROXY_URL = 'https://empty-scene-c54e.alekziinamassa.workers.dev';

        const urlParams = new URLSearchParams(window.location.search);
        const numeroSala = urlParams.get('numero');

        if (!numeroSala || isNaN(numeroSala) || numeroSala < 1 || numeroSala > 48) {
            alert("Nenhuma sala válida selecionada.");
            window.location.href = "index.html";
        }

        document.getElementById('sala-numero').textContent = String(numeroSala).padStart(2, '0');
        document.getElementById('sala').value = String(numeroSala).padStart(2, '0');

        const agora = new Date();
        document.getElementById('data-hora').textContent = agora.toLocaleString('pt-BR');

        const form = document.getElementById('form-reserva');
        const btnEnviar = document.getElementById('btn-enviar');
        const msgErro = document.getElementById('mensagem-erro');
        const msgSucesso = document.getElementById('mensagem-sucesso');
        const inputId = document.getElementById('id_jogador');
        const inputNome = document.getElementById('nome_jogador');
        const loadingIcon = document.getElementById('loading-icon');

        let debounceTimer;

        // BUSCA AUTOMÁTICA DO NICKNAME
        inputId.addEventListener('input', function(e) {
            const uid = e.target.value.trim();
            clearTimeout(debounceTimer);
            inputNome.style.color = 'var(--text-primary)';

            if (uid.length >= 5) {
                loadingIcon.style.display = 'block';
                inputNome.placeholder = 'Buscando nome...';
                
                debounceTimer = setTimeout(async () => {
                    try {
                        const response = await fetch(`${PROXY_URL}/?uid=${encodeURIComponent(uid)}`, {
                            method: 'GET',
                            headers: { 'Accept': 'application/json' }
                        });

                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();

                        if (data.ok && data.nickname) {
                            inputNome.value = data.nickname;
                            inputNome.style.color = 'var(--success)';
                        } else if (data.erro) {
                            inputNome.value = '';
                            inputNome.style.color = 'var(--error)';
                            inputNome.placeholder = 'ID não encontrado. Digite manualmente.';
                        } else {
                            inputNome.value = '';
                            inputNome.style.color = 'var(--text-secondary)';
                            inputNome.placeholder = 'Digite o nome manualmente';
                        }
                    } catch (error) {
                        console.warn('Erro na consulta de nickname:', error);
                        inputNome.value = '';
                        inputNome.style.color = 'var(--text-secondary)';
                        inputNome.placeholder = 'Erro na conexão. Digite manualmente';
                    } finally {
                        loadingIcon.style.display = 'none';
                    }
                }, 800);
            } else {
                inputNome.value = '';
                inputNome.placeholder = 'Será preenchido automaticamente';
                loadingIcon.style.display = 'none';
            }
        });

        // MÁSCARA DE TELEFONE
        document.getElementById('telefone').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            e.target.value = value;
        });

        // VALIDAÇÃO DE CAMPOS
        function validarCampos() {
            const id = inputId.value.trim();
            const nome = inputNome.value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const pix = document.getElementById('pix').value.trim();

            if (!id || id.length < 5) return { valido: false, erro: 'ID do Free Fire inválido. Mínimo 5 dígitos.' };
            if (!nome || nome.length < 3) return { valido: false, erro: 'Nome do jogador inválido. Mínimo 3 caracteres.' };
            
            const telLimpo = telefone.replace(/\D/g, '');
            if (telLimpo.length < 10 || telLimpo.length > 11) return { valido: false, erro: 'WhatsApp inválido. Use DDD + número (10-11 dígitos).' };
            if (!pix || pix.length < 5) return { valido: false, erro: 'Chave PIX inválida.' };

            return { valido: true };
        }

        function mostrarMensagem(tipo, texto) {
            msgErro.style.display = 'none';
            msgSucesso.style.display = 'none';
            if (tipo === 'erro') {
                msgErro.textContent = texto;
                msgErro.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                msgSucesso.textContent = texto;
                msgSucesso.style.display = 'block';
            }
        }

        // ENVIO DO FORMULÁRIO
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const validacao = validarCampos();
            if (!validacao.valido) {
                mostrarMensagem('erro', validacao.erro);
                return;
            }
            
            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando e Salvando...';
            msgErro.style.display = 'none';

            try {
                // 1. Verificar se a sala já foi ocupada
                const responseRead = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'read' })
                });
                
                if (!responseRead.ok) throw new Error(`Falha na conexão (Read): ${responseRead.status}`);
                const dataRead = await responseRead.json();

                if (dataRead.status === 'success') {
                    const salaOcupada = dataRead.data.some(row => 
                        String(row.sala).trim() === String(numeroSala).trim()
                    );

                    if (salaOcupada) {
                        throw new Error("❌ Esta sala acabou de ser reservada por outro jogador. Volte e escolha outra.");
                    }
                } else {
                    throw new Error(dataRead.message || "Falha ao verificar disponibilidade.");
                }

                // 2. Salvar os dados
                const dadosParaEnviar = {
                    action: 'create',
                    sala: String(numeroSala).padStart(2, '0'),
                    id: inputId.value.trim(),
                    'o jogador': inputNome.value.trim(),
                    pix: document.getElementById('pix').value.trim(),
                    telefone: document.getElementById('telefone').value.trim()
                };

                console.log("📤 Enviando dados para a planilha:", dadosParaEnviar);

                const responseCreate = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(dadosParaEnviar)
                });

                if (!responseCreate.ok) {
                    const errorText = await responseCreate.text();
                    throw new Error(`Falha na conexão (Create): ${responseCreate.status} - ${errorText}`);
                }

                const dataCreate = await responseCreate.json();
                console.log("✅ Resposta do servidor:", dataCreate);

                if (dataCreate.status === 'success') {
                    mostrarMensagem('sucesso', '✅ Vaga reservada com sucesso! Redirecionando...');
                    setTimeout(() => {
                        window.location.href = "zap1.html";
                    }, 1500);
                } else {
                    throw new Error(dataCreate.message || "Erro ao salvar os dados.");
                }

            } catch (error) {
                console.error("🚨 ERRO DETALHADO:", error);
                let msg = error.message || "Ocorreu um erro desconhecido.";
                
                if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('CORS')) {
                    msg = "❌ Erro de conexão com o Google Sheets.\n\nVerifique:\n1. O script foi implantado como 'Qualquer pessoa'?\n2. Sua internet está funcionando?\n3. Desative o AdBlock temporariamente.";
                }
                
                mostrarMensagem('erro', msg);
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = '<i class="fas fa-check-circle"></i> RESERVAR VAGA AGORA';
            }
        });
    </script>
</body>

<script>
    // Remove/esconde o iframe do Netlify
    (function hideNetlifyBadge() {
        function removeBadge() {
            // Tenta esconder pelo ID
            var iframe = document.getElementById('nl-badge-frame');
            if (iframe) {
                iframe.style.display = 'none';
                iframe.style.visibility = 'hidden';
                iframe.style.opacity = '0';
                iframe.remove(); // Remove completamente do DOM
            }
            
            // Tenta esconder por seletor CSS genérico
            var badges = document.querySelectorAll('iframe[title*="Netlify"], iframe[srcdoc*="Netlify"]');
            badges.forEach(function(badge) {
                badge.style.display = 'none';
                badge.remove();
            });
        }

        // Executa imediatamente
        removeBadge();

        // Executa após DOM carregado
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', removeBadge);
        }

        // Executa após página carregar completamente
        window.addEventListener('load', function() {
            setTimeout(removeBadge, 100);
            setTimeout(removeBadge, 500);
            setTimeout(removeBadge, 1500);
        });

        // Usa MutationObserver para detectar quando o iframe for injetado
        if (window.MutationObserver) {
            var observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.tagName === 'IFRAME' && 
                            (node.id === 'nl-badge-frame' || 
                             node.title.indexOf('Netlify') !== -1)) {
                            node.style.display = 'none';
                            setTimeout(function() { node.remove(); }, 10);
                        }
                    });
                });
            });

            observer.observe(document.body || document.documentElement, {
                childList: true,
                subtree: true
            });
        }
    })();
</script>
